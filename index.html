<style>
  html, body {
    margin: 0; height: 100%; background: #000; color: #ffd6ea;
    overflow: hidden; overscroll-behavior: none;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  body { position: fixed; inset: 0; }
  :root { --bar: 84px; --b: min(54px, calc((100vw - 24px - 5 * 8px) / 6)); }
  #stage {
    position: absolute;
    left: env(safe-area-inset-left); right: env(safe-area-inset-right);
    top: env(safe-area-inset-top);
    bottom: calc(env(safe-area-inset-bottom) + var(--bar));
  }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #bar {
    position: absolute; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom) + 8px);
    height: calc(var(--bar) - 8px);
    display: flex; justify-content: center; align-items: center; gap: min(12px, 2.2vw);
    transition: opacity .6s;
  }
  #bar.off { opacity: .3; pointer-events: none; }
  .btn {
    width: var(--b); height: var(--b); border-radius: 50%; padding: 0; flex: 0 0 auto;
    border: 1.5px solid rgba(255, 146, 195, .6);
    background: radial-gradient(circle at 35% 30%, rgba(255, 170, 210, .28), rgba(255, 120, 180, .08));
    color: #fff; font-size: calc(var(--b) * 0.42); line-height: 1; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 0 10px rgba(255, 120, 190, .25);
    transition: transform .08s, background .15s;
    touch-action: manipulation;
  }
  .btn small { font-size: max(8px, calc(var(--b) * 0.175)); color: #ffc4e1; margin-top: 2px; letter-spacing: -.2px; }
  .btn:active, .btn.hit { transform: scale(.88); background: rgba(255, 140, 200, .45); }
  #hint {
    position: absolute; left: 0; right: 0; text-align: center;
    bottom: calc(env(safe-area-inset-bottom) + var(--bar) - 4px);
    font-size: 11px; color: rgba(255, 200, 230, .45); display: none;
  }
  @media (hover: hover) and (pointer: fine) { #hint { display: block; } }
</style>
</head>

const GS = { on: false, s: 0, box: 0, lidS: -1, rise: 0, eat: 0, bowlS: 1, bowlTw: 0, steam: 0, rays: 0 };
function computeFX() {
  FX.mouthO = 0; FX.happy = 0; FX.eyeClose = 0; FX.lift = 0; FX.belly = 0;
  FX.gsx = 1; FX.gsy = 1; FX.jy = 0; FX.yaw = 0; FX.calm = false; FX.flake = -1;
  const mouthAt = () => STATE.mouthView || MO_C;

  // 눈 받아먹기: 고개 들고 → 입 동그랗게 → 냠 → 웃는 입
  const xc = mp('catch');
  if (xc >= 0) {
    const s = xc * DUR.catch; FX.calm = true;
    FX.lift = smooth(0, 0.4, s) * (1 - smooth(1.75, 2.3, s));
    FX.mouthO = Math.max(smooth(0.2, 0.45, s) * (1 - smooth(1.36, 1.48, s)), 0.5 * bump(s, 1.6, 0.24));
    if (s < 1.45) FX.flake = s / 1.45;
    else if (once('catch', 'nom')) { const m = mouthAt(); emitSparkles(m[0], m[1] - 10, 6, 260, SNOW_B, 0.45, 0); kickHat(0.5); }
  }

  // 에취: 웅크림(에…) → 에취! 반짝이 팡 → 부르르
  const xz = mp('sneeze');
  if (xz >= 0) {
    const s = xz * DUR.sneeze; FX.calm = true;
    const pre = smooth(0.05, 0.7, s) * (1 - smooth(0.7, 0.78, s)), snap = bump(s, 0.7, 0.45);
    FX.gsy *= (1 - 0.075 * pre) * (1 + 0.06 * bump(s, 0.7, 0.25)); FX.gsx *= 1 + 0.05 * pre;
    FX.lift += 0.7 * pre - 0.9 * snap;
    FX.eyeClose = smooth(0.3, 0.62, s) * (1 - smooth(1.0, 1.15, s));
    FX.mouthO = Math.max(FX.mouthO, 0.32 * smooth(0.35, 0.6, s) * (1 - smooth(0.66, 0.7, s)), 0.85 * bump(s, 0.7, 0.32));
    if (s >= 0.72 && once('sneeze', 'achoo')) {
      const m = mouthAt();
      emitSparkles(m[0], m[1] + 25, 20, 780, null, 0.55, 500, Math.PI * 1.3, Math.PI / 2);
      emitSparkles(m[0], m[1] + 25, 6, 500, SNOW_B, 0.5, 300, Math.PI * 0.8, Math.PI / 2);
      kickHat(1.3);
      if (navigator.vibrate) { try { navigator.vibrate(20); } catch (e) {} }
    }
    if (s > 0.85) {
      const d = s - 0.85, amp = Math.exp(-2.4 * d) * (1 - smooth(1.8, 2.15, s));
      FX.yaw += 0.055 * amp * Math.sin(2 * Math.PI * 13 * d); FX.gsx *= 1 + 0.02 * amp * Math.sin(2 * Math.PI * 17 * d);
    }
  }

  // 선물 열기 — 고봉밥 버전
  const xg = mp('gift');
  GS.on = xg >= 0;
  if (GS.on) {
    const s = xg * DUR.gift; GS.s = s; FX.calm = true;
    GS.box = s < 9.9 ? easeOutBack(s / 0.9) : 1 - easeInOutCubic((s - 9.9) / 0.8);    // 1. 상자 쑥
    if (s > 0.9 && s < 2.0) {                                                       // 2. 두근두근
      const e = (s - 0.9) / 1.1, env = Math.sin(Math.PI * e);
      FX.jy += 16 * env * Math.abs(Math.sin(2 * Math.PI * 3 * e));
      FX.gsy *= 1 + 0.035 * env * Math.sin(2 * Math.PI * 6 * e); FX.gsx *= 1 - 0.02 * env * Math.sin(2 * Math.PI * 6 * e);
    }
    if (s >= 2.0 && s < 2.0 + DUR.jump) {                                           //    폴짝
      jumpPose((s - 2.0) / DUR.jump); FX.gsx *= JP.gsx; FX.gsy *= JP.gsy; FX.jy += JP.jy;
      if (JP.land && once('gift', 'land')) emitLanding();
    }
    GS.lidS = s - 2.69;                                                             //    착지하면 뚜껑 뻥
    if (s >= 2.69 && once('gift', 'pop')) { emitSparkles(871, 1440, 14, 650, GOLD_RAY, 0.6, 900, Math.PI * 0.9, -Math.PI / 2); }
    GS.rise = smooth(2.95, 4.4, s);                                                 // 3. 고봉밥 천천히 쑥
    GS.rays = bump(s, 4.4, 1.0);                                                    // 4. 빛살 + 하트·별
    if (s >= 4.4 && once('gift', 'burst')) {
      emitHearts(6, false, 871, 1150);
      emitSparkles(871, 1230, 14, 620, GOLD_RAY, 0.9, 350, Math.PI * 1.2, -Math.PI / 2);
      emitSparkles(871, 1230, 8, 520, null, 0.8, 350, Math.PI * 1.4, -Math.PI / 2);
    }
    FX.happy = smooth(4.45, 4.55, s) * (1 - smooth(5.95, 6.05, s));                 // 5. ^ 눈, + 빙글, 날개, 콩콩
    if (s >= 4.5 && once('gift', 'bspin')) motions.bspin = clock;
    if (s >= 4.6 && once('gift', 'flap')) motions.flap = clock;
    if (s >= 5.0 && s < 6.0) {
      const u = ((s - 5.0) % 0.5) / 0.5;
      FX.jy += 60 * Math.sin(Math.PI * u); FX.gsy *= 1 + 0.05 * Math.sin(Math.PI * u);
      if (u > 0.85 && once('gift', s < 5.5 ? 'hop1' : 'hop2')) kickHat(0.7);
    }
    GS.steam = smooth(3.6, 4.3, s) * (1 - smooth(7.9, 8.7, s));                     // 6. 김 3초 → 냠!
    FX.mouthO = Math.max(FX.mouthO, smooth(7.4, 7.65, s) * (1 - smooth(8.85, 9.0, s)), 0.5 * bump(s, 9.1, 0.28), 0.5 * bump(s, 9.45, 0.28));
    GS.eat = easeInOutCubic((s - 7.8) / 1.1);
    if (s > 7.8 && s < 8.85 && !FORCE && Math.random() < 0.7) {                     //    밥알이 입으로 쏙
      const m = mouthAt(), top = STATE.riceTop || 1210, x = 871 + (Math.random() - 0.5) * 90, y = top + 10, T = 0.3;
      particles.push({ heart: false, x, y, vx: (m[0] - x) / T, vy: (m[1] + 10 - y) / T, g: 0, age: 0, life: T, ph: 0, col: RICE, small: true });
    }
    FX.belly = bump(s, 9.0, 1.1);                                                   //    배 볼록
    GS.bowlTw = bump(s, 9.1, 0.8);
    GS.bowlS = 1 - easeInOutCubic((s - 9.35) / 0.55);                               //    그릇 반짝 사라짐
    if (s >= 9.35 && once('gift', 'vanish')) {
      emitSparkles(871, 1400, 16, 420, GOLD_RAY, 0.8, -60);
      emitSparkles(871, 1400, 8, 300, null, 0.7, -60);
    }
  }
}

const AUTO = ['jump', 'wave', 'flap', 'wink', 'bspin', 'tail', 'orb', 'catch', 'sneeze'];
function autoMotion() {
  if (!built() || FREEZE) return;
  if (clock < T_IDLE + 3) { nextAuto = Math.max(nextAuto, T_IDLE + 3); return; }
  if (SOLO.some(isOn)) { nextAuto = Math.max(nextAuto, clock + 1.2); return; }
  if (clock < nextAuto) return;
  if (isOn('jump') || isOn('wave') || isOn('spin')) return;
  if (clock - lastGift > 20 + Math.random() * 2) trigger('gift', false);           // 20초에 한 번쯤 선물
  else if (clock - lastSpecial > 9 + Math.random() * 3) { trigger('spin', false); lastSpecial = clock; }
  else trigger(AUTO[Math.random() * AUTO.length | 0], false);
  nextAuto = clock + 2 + Math.random();
}

// ═════════════════════════════════════════════════════════════════════
//  캐릭터 그리기 (dragon.py draw_character 그대로 + 모션)
// ═════════════════════════════════════════════════════════════════════
const STATE = { orbView: null, pomView: null, mouthView: null, riceTop: 0, wobT: -99, wobA: 0 };
function revealMask(py, name, t, bottom, top) {
  const [w0, w1] = REVEAL[name], p = clamp01((t - w0) / (w1 - w0)), front = bottom - p * (bottom - top + 40);
  RV.vis = py >= front; RV.f = p < 1 ? Math.exp(-Math.abs(py - front) / 25) * 0.9 : 0;
}
const RV = { vis: true, f: 0 };

function drawCharacter(t, ta) {
  const idle = STILL ? 0 : clamp01((t - T_IDLE) / 0.8);
  const ph = 2 * Math.PI * ta / 2.2;
  const body_sy = 1 + 0.018 * Math.sin(ph) * idle;
  const ground = CY - 1650;
  const head_dy = (body_sy - 1) * ((CY - 1170) - ground) + 5 * Math.sin(ph - 0.6) * idle + 24 * FX.lift;
  const bxf = p => [p[0], ground + (p[1] - ground) * body_sy, p[2]];
  const S_body = [1 + 0.07 * FX.belly, body_sy, 1 + 0.17 * FX.belly];     // 밥 먹고 배 볼록

  // 모션 값
  const xw = mp('wave');
  let raise = 0, armTh = 0;
  if (xw >= 0) {
    raise = smooth(0.08, 0.24, xw) * (1 - smooth(0.82, 0.98, xw));
    const wv = xw > 0.24 && xw < 0.82 ? Math.sin(2 * Math.PI * 3 * (xw - 0.24) / 0.58) : 0;
    armTh = raise * (95 * Math.PI / 180) + raise * (22 * Math.PI / 180) * wv;
  }
  const armRot = raise > 0 ? { th: armTh, px: RIGHT_SHOULDER[0] - CX, py: CY - RIGHT_SHOULDER[1], z: 330 * raise } : null;
  const xt = mp('tail');
  const tailY = xt >= 0 ? 0.55 * Math.sin(2 * Math.PI * 2.5 * xt) * (1 - xt) : 0;
  const tailZ = xt >= 0 ? 0.22 * Math.sin(2 * Math.PI * 2.5 * xt + 0.6) * (1 - xt) : 0;
  const tailRot = (xt >= 0) ? (() => { const M = rotZ(tailZ), N = rotY(tailY); return [
    M[0] * N[0] + M[1] * N[3] + M[2] * N[6], M[0] * N[1] + M[1] * N[4] + M[2] * N[7], M[0] * N[2] + M[1] * N[5] + M[2] * N[8],
    M[3] * N[0] + M[4] * N[3] + M[5] * N[6], M[3] * N[1] + M[4] * N[4] + M[5] * N[7], M[3] * N[2] + M[4] * N[5] + M[5] * N[8],
    M[6] * N[0] + M[7] * N[3] + M[8] * N[6], M[6] * N[1] + M[7] * N[4] + M[8] * N[7], M[6] * N[2] + M[7] * N[5] + M[8] * N[8]]; })() : null;
  const TB = P(TAIL_B[0], TAIL_B[1], TAIL_B[2]);
  const tailXf = p => { if (!tailRot) return p; const r = mv(tailRot, [p[0] - TB[0], p[1] - TB[1], p[2] - TB[2]]); return [r[0] + TB[0], r[1] + TB[1], r[2] + TB[2]]; };

  // ── 발 ──
  ['foot_l', 'foot_r'].forEach((name, i) => {
    if (t < REVEAL[name][0]) return;
    const f0 = FEET[i];
    const tc = T_DETAIL + (2 + i) * 0.1, sc = t >= tc ? pop(t, tc) : 0, fl = flash(t, tc);
    ellipsoid(P(f0[0], f0[1], FOOT_Z), FOOT_R, null, null, (k, tt, qx, qy, qz) => {
      const px = f0[0] + qx * FOOT_R[0], py = f0[1] - qy * FOOT_R[1];
      revealMask(py, name, t, GROUND_PY, f0[1] - FOOT_R[1]);
      if (!RV.vis || py > GROUND_PY) return;
      let f = RV.f, L = PINK, Sh = PINK_SHADE, D = PINK_DEEP, cloud = false;
      if (t >= tc) {
        const cx0 = (CLOUD_BOX_L[0] + CLOUD_BOX_L[1]) / 2;
        let cxx = i === 0 ? px : (FEET[0][0] + FEET[1][0]) - px;
        cxx = cx0 + (cxx - cx0) / Math.max(sc, 1e-3);
        const cyy = 1650 + (py - 1650) / Math.max(sc, 1e-3);
        cloud = cxx >= CLOUD_BOX_L[0] && cxx <= CLOUD_BOX_L[1] && cyy >= CLOUD_BOX_L[2];
        for (const [ccx, ccy, cr] of CLOUD_L) if ((cxx - ccx) ** 2 + (cyy - ccy) ** 2 < cr * cr) cloud = true;
        cloud = cloud && qz > 0.2;
        if (cloud) { L = WHITE; Sh = WHITE_SHADE; D = WHITE_DEEP; f += fl * 0.8; }
      }
      lit(VN[0], VN[1], VN[2], L, Sh, D, 0.35 * smooth(0.55, 0.95, -qy), 0.04, hiOf(L)); flashLO(f);
      put(k, tt, LO[0], LO[1], LO[2], LO[3], cloud ? MARK_CLOUD : 0, PART_BODY);
    });
  });

  // ── 몸통 + 배 ──
  if (t >= REVEAL.body[0]) {
    const st = STRIPES.map((_, j) => { const ts = T_DETAIL + j * 0.1; return t >= ts ? [(BELLY_R[0] + 20) * easeOutCubic((t - ts) / 0.25), flash(t, ts)] : null; });
    ellipsoid(bxf(P(BODY_C[0], BODY_C[1])), BODY_R, null, S_body, (k, tt, qx, qy, qz) => {
      const px = BODY_C[0] + qx * BODY_R[0], py = BODY_C[1] - qy * BODY_R[1];
      revealMask(py, 'body', t, BODY_C[1] + BODY_R[1], HEAD_BOT - 10);
      if (!RV.vis) return;
      let f = RV.f, L = PINK, Sh = PINK_SHADE, D = PINK_DEEP, mk = 0;
      const belly = qz > 0 && ((px - BELLY_C[0]) / BELLY_R[0]) ** 2 + ((py - BELLY_C[1]) / BELLY_R[1]) ** 2 < 1;
      if (belly) {
        L = WHITE; Sh = WHITE_SHADE; D = WHITE_DEEP;
        for (let j = 0; j < 2; j++) if (st[j] && py >= STRIPES[j][0] && py <= STRIPES[j][1] && Math.abs(px - BELLY_C[0]) <= st[j][0]) {
          L = STRIPE; Sh = STRIPE_SHADE; mk = MARK_STRIPE; f += st[j][1] * 0.8;
        }
      }
      const extra = 0.45 * smooth(130, 0, py - HEAD_BOT) * smooth(520, 380, Math.abs(px - CX));
      lit(VN[0], VN[1], VN[2], L, Sh, D, extra, 0.04, hiOf(L)); flashLO(f);
      put(k, tt, LO[0], LO[1], LO[2], LO[3], mk, PART_BODY);
    });
  }

  // ── 꼬리 + 가시 ──
  if (t >= REVEAL.tail[0]) {
    const [w0, w1] = REVEAL.tail, p = clamp01((t - w0) / (w1 - w0)), front = TAIL_B[0] + p * (TAIL_T[0] - TAIL_B[0] + 30);
    cone(TB, tailXf(P(TAIL_T[0], TAIL_T[1], TAIL_T[2])), TAIL_RB, (k, tt, ox) => {
      const px = ox + CX;
      if (px > front) return;
      lit(VN[0], VN[1], VN[2], PINK, PINK_SHADE, PINK_DEEP, 0, 0.04, PINK_HI);
      if (p < 1) flashLO(Math.exp(-Math.abs(px - front) / 25) * 0.9);
      put(k, tt, LO[0], LO[1], LO[2], LO[3], 0, PART_BODY);
    });
  }
  SPIKES.forEach(([[bx, by], [tx, ty], rb], i) => {
    const t0 = T_DETAIL + (8 + i) * 0.1, s = pop(t, t0);
    if (s <= 0) return;
    const B0 = P(bx, by, -35), T0 = P(tx, ty, -35), Tq = [B0[0] + (T0[0] - B0[0]) * s, B0[1] + (T0[1] - B0[1]) * s, B0[2]];
    const fl = flash(t, t0) * 0.8;
    cone(tailXf(B0), tailXf(Tq), rb * Math.max(s, 0.05), (k, tt) => {
      lit(VN[0], VN[1], VN[2], WHITE, WHITE_SHADE, WHITE_DEEP, 0, 0.25, null); flashLO(fl);
      put(k, tt, LO[0], LO[1], LO[2], LO[3], MARK_SPIKE, PART_BODY);
    });
  });

  // ── 팔 + 발톱 ──
  ['arm_l', 'arm_r'].forEach((name, i) => {
    if (t < REVEAL[name][0]) return;
    const sgn = i === 0 ? -1 : 1, rot = i === 1 ? armRot : null;
    hitArm(i === 1, body_sy, rot, (k, tt, py, u) => {
      revealMask(py, name, t, 1524, HEAD_BOT - 20);
      if (!RV.vis) return;
      const extra = 0.35 * smooth(120, 0, py - HEAD_BOT) * (rot ? 1 - raise : 1) + 0.3 * smooth(0.5, 0.95, -sgn * u) * smooth(1300, 1420, py);
      lit(VN[0], VN[1], VN[2], PINK, PINK_SHADE, PINK_DEEP, extra, 0.04, PINK_HI); flashLO(RV.f);
      put(k, tt, LO[0], LO[1], LO[2], LO[3], 0, PART_BODY);
    });
    CLAWS_L.forEach(([[bx, by], [tx, ty]], j) => {
      const t0 = T_DETAIL + (4 + 2 * i + j) * 0.1, s = pop(t, t0);
      if (s <= 0) return;
      if (i === 1) { bx = mirror(bx); tx = mirror(tx); }
      let B0 = bxf(P(bx, by, ARM_Z + 45)), T1 = bxf(P(tx, ty, ARM_Z + 45));
      let T0 = [B0[0] + (T1[0] - B0[0]) * s, B0[1] + (T1[1] - B0[1]) * s, B0[2] + (T1[2] - B0[2]) * s];
      if (rot) {
        const rp = p => { const x = p[0] - rot.px, y = p[1] - rot.py, c = Math.cos(rot.th), sn = Math.sin(rot.th); return [rot.px + c * x - sn * y, rot.py + sn * x + c * y, p[2] + rot.z]; };
        B0 = rp(B0); T0 = rp(T0);
      }
      const fl = flash(t, t0) * 0.8;
      cone(B0, T0, CLAW_R * Math.max(s, 0.05), (k, tt) => {
        lit(VN[0], VN[1], VN[2], WHITE, WHITE_SHADE, WHITE_DEEP, 0, 0.25, null); flashLO(fl);
        put(k, tt, LO[0], LO[1], LO[2], LO[3], MARK_SPIKE, PART_BODY);
      });
    });
  });

  // ── 머리 ──
  let sx = 0, sy = 0;
  if (t >= T_HEAD) {
    const x = (t - T_HEAD) / 0.9;
    if (x >= 1) { sx = sy = 1; } else {
      const s = 1 - Math.exp(-5 * x) * Math.cos(8 * x), sq = 0.22 * Math.exp(-3.5 * x) * Math.sin(13 * x);
      sx = s * (1 + sq); sy = s * (1 - sq);
    }
  }
  if (sx < 0.02) return;
  const HB = [0, CY - HEAD_BOT + head_dy, 0], SH = [sx, sy, sx];
  const hxf = p => [HB[0] + sx * p[0], HB[1] + sy * (p[1] - (CY - HEAD_BOT)), HB[2] + sx * p[2]];

  // 윙크: 0 = 뜬 눈, 1 = 감은 눈(짧은 곡선)
  let closed = STILL ? 0 : Math.max(bump(t, T_IDLE + 0.8, 0.4), bump(t, T_LEYE + 2.4, 0.3)) * 0.85;
  const xk = mp('wink');
  if (xk >= 0) closed = Math.max(closed, smooth(0, 0.3, xk) * (1 - smooth(0.7, 1, xk)));
  closed = Math.max(closed, FX.eyeClose);
  const openv = 1 - closed, happy = FX.happy > 0.5;

  const fHead = flash(t, T_HEAD, 0.35) * 0.7;
  const sweep = HEAD_BOT - (HEAD_BOT - 480) * easeOutCubic((t - T_FACE) / 0.8);
  const mpr = clamp01((t - T_MOUTH) / 0.8), sF = pop(t, T_FANG), flF = flash(t, T_FANG) * 0.8;
  const sE = pop(t, T_LEYE), flE = flash(t, T_LEYE) * 0.6, sB = pop(t, T_LEYE + 0.15);
  // 입: mo < 0.3 이면 웃는 입, 넘으면 동그란 입(송곳니는 동그란 입 오른쪽 아래에 붙어 따라가요)
  const mo = FX.mouthO, oMouth = mo >= 0.3 && mpr >= 1, oe = 0.45 + 0.55 * smooth(0.3, 1, mo);
  const orx = MO_R[0] * oe, ory = MO_R[1] * oe, oavg = (orx + ory) / 2;
  const fangC = oMouth ? [MO_C[0] + 0.57 * orx, MO_C[1] + 0.82 * ory - 8] : FANG_C, fangS = oMouth ? 0.7 : 1;
  hitHead(HB, sx, sy, (k, tt, lx, ly, lz, Cw) => {
    const px = CX + lx, py = HEAD_BOT - ly, front = lz > 0.15 * Cw;
    let L = PINK, Sh = PINK_SHADE, D = PINK_DEEP, f = fHead, brown = false, fangW = false;
    if (t >= T_FACE) {
      let white = py > FACE_LINE && lz > -0.35 * Cw;
      if (!white && lz > 0) for (const [bx, by] of BUMPS)
        if ((Math.abs(px - bx) / BUMP_R[0]) ** BUMP_P + (Math.abs(py - by) / BUMP_R[1]) ** BUMP_P <= 1) { white = true; break; }
      if (py < sweep) white = false;
      if (white) { L = WHITE; Sh = WHITE_SHADE; D = WHITE_DEEP; if (t < T_FACE + 1) f += Math.exp(-Math.abs(py - sweep) / 30) * 0.5; }
    }
    if (front) {
      if (oMouth) {
        if (Math.abs(px - MO_C[0]) < orx + MOUTH_W + 4 && Math.abs(py - MO_C[1]) < ory + MOUTH_W + 4) {
          const dn = Math.hypot((px - MO_C[0]) / orx, (py - MO_C[1]) / ory);
          if (Math.abs(dn - 1) * oavg <= MOUTH_W * 0.95) brown = true;
          else if (dn < 1) { L = MOUTH_IN; Sh = MOUTH_IN_SH; D = MOUTH_IN_SH; }
        }
      } else if (mpr > 0 && px > 520 && px < 1200 && py > 920 && py < 1090) {
        polyDist(MOUTH, px, py);
        if (PD.d <= MOUTH_W && PD.u <= mpr) { brown = true; if (mpr < 1) f += clamp01(1 - (mpr - PD.u) / 0.1) * 0.6; }
      }
      if (sF > 0) {
        const fs = sF * fangS, fx = (px - fangC[0]) / fs, fy = (py - fangC[1]) / fs, hw = FANG_HW * (1 - fy / FANG_H);

    }

    } else {
      const v = 1 - ly / HH;
      lit(VN[0], VN[1], VN[2], L, Sh, D, 0.6 * smooth(0.75, 1, v) + 0.75 * smooth(0.32, 0, v), 0.03, hiOf(L)); flashLO(f);
    }

  });

  STATE.mouthView = toView(hxf(P(MO_C[0], MO_C[1], 380)));

  // ── 오른쪽 단추 눈 ──
  let s = pop(t, T_REYE, 0.6);
  if (s > 0) {
    const A_ = headA(HEAD_BOT - REYE_C[1]);
    const zf = H_DEPTH * A_ * Math.sqrt(Math.max(0, 1 - ((REYE_C[0] - CX) / A_) ** 2));
    const tilt = Math.atan2((REYE_C[0] - CX) / A_ ** 2, zf / (H_DEPTH * A_) ** 2);
    let spin = (1 - easeOutCubic((t - T_REYE) / 0.8)) * 2.5 * 2 * Math.PI;
    const xb = mp('bspin'); if (xb >= 0) spin += 2 * Math.PI * easeInOutCubic(xb);
    const cs = Math.cos(spin), sn = Math.sin(spin), fl = flash(t, T_REYE, 0.4) * 0.5;
    ellipsoid(hxf(P(REYE_C[0], REYE_C[1], zf + 4)), [REYE_R * s, REYE_R * s, REYE_D * s], rotY(tilt), SH, (k, tt, qx, qy) => {
      const ux = cs * qx + sn * qy, uy = -sn * qx + cs * qy;
      const plus = (Math.abs(ux - 0.03) < 0.135 && Math.abs(uy) < 0.62) || (Math.abs(uy) < 0.135 && Math.abs(ux - 0.03) < 0.58);
      if (plus) lit(VN[0], VN[1], VN[2], GREEN_DARK, GREEN_DARK2, GREEN_DARK2, 0, 0.1, null);
      else {
        lit(VN[0], VN[1], VN[2], LIME, LIME_SHADE, LIME_SHADE, 0, 0.35, LIME_HI);

        for (let c = 0; c < 4; c++) LO[c] *= 1 - 0.18 * rim;
      }
      const hl = Math.exp(-(((qx + 0.52) / 0.16) ** 2 + ((qy - 0.48) / 0.22) ** 2));
      const arc = Math.exp(-(((Math.hypot(qx, qy) - 0.8) / 0.07) ** 2)) * smooth(0, 0.6, qy - qx);

  }

  // ── 날개 ──

    const xf = mp('flap'); if (xf >= 0) flap += 0.6 * Math.sin(2 * Math.PI * 4 * xf) * (1 - 0.3 * xf);

    let ex = mv(Rf, [1, 0, Math.tan(WING_TILT * Math.PI / 180)]), ey = mv(Rf, [0, 1, 0]);
    ex = [ex[0] * sx, ex[1] * sy, ex[2] * sx]; ey = [ey[0] * sx, ey[1] * sy, ey[2] * sx];
    let pn = norm3([ex[1] * ey[2] - ex[2] * ey[1], ex[2] * ey[0] - ex[0] * ey[2], ex[0] * ey[1] - ex[1] * ey[0]]);
    viewN(pn[0], pn[1], pn[2]); if (VN[2] < 0) pn = [-pn[0], -pn[1], -pn[2]];
    viewN(pn[0], pn[1], pn[2]); const PNV = [VN[0], VN[1], VN[2]];
    const exu = norm3(ex), eyu = norm3(ey);
    const a1 = Math.atan2(WING_ROOT[1] - WING_BONE1[5][1], WING_BONE1[5][0] - WING_ROOT[0]);
    const fl = flash(t, T_WING, 0.35) * 0.6;
    hitPlane(O, ex, ey, 520, (k, tt, u, v) => {
      const ang = Math.atan2(v, u), ang0 = a1 + (ang - a1) / Math.max(spread, 0.05), rad = Math.hypot(u, v) / Math.max(s, 1e-3);
      const wx = WING_ROOT[0] + rad * Math.cos(ang0), wy = WING_ROOT[1] - rad * Math.sin(ang0);
      if (wx < 150 || wx > 640 || wy < 120 || wy > 450) return;
      let hit = inPoly(wx, wy, WING_MEM);
      if (hit) for (const [ccx, ccy, r2] of SCALLOPS) if ((wx - ccx) ** 2 + (wy - ccy) ** 2 <= r2) { hit = false; break; }
      let bone = false;
      for (const [Ln, r0, r1] of BONES) {
        polyDist(Ln, wx, wy);
        const rr = r0 + (r1 - r0) * PD.u;
        if (PD.d <= rr) {
          const nz = Math.sqrt(clamp01(1 - (PD.d / rr) ** 2)), side = Math.sqrt(1 - nz * nz);
          const dx = PD.dx / Math.max(PD.d, 1e-6), dy = -PD.dy / Math.max(PD.d, 1e-6);
          viewN(pn[0] * nz + (dx * exu[0] + dy * eyu[0]) * side, pn[1] * nz + (dx * exu[1] + dy * eyu[1]) * side, pn[2] * nz + (dx * exu[2] + dy * eyu[2]) * side);
          lit(VN[0], VN[1], VN[2], PINK, PINK_SHADE, PINK_DEEP, 0, 0.04, PINK_HI);
          bone = true;
        }
      }
      if (!bone) { if (!hit) return; lit(PNV[0], PNV[1], PNV[2], MEMBRANE, MEMBRANE_SH, MEMBRANE_SH, 0, 0, null); }
      flashLO(fl);
      put(k, bone ? tt + 6 : tt, LO[0], LO[1], LO[2], LO[3], 0, PART_WING);
    });
  }

  // ── 달 구슬 ──
  s = pop(t, T_ORB, 0.5);
  STATE.orbView = null;
  if (s > 0) {
    const kc = hxf(P(KNOB_C[0], KNOB_C[1], 75));
    ellipsoid(kc, KNOB_R.map(v => v * Math.min(1, s * 1.5)), rotZ(KNOB_TILT * Math.PI / 180), SH, (k, tt) => {
      lit(VN[0], VN[1], VN[2], PINK, PINK_SHADE, PINK_DEEP, 0, 0.04, PINK_HI);
      put(k, tt, LO[0], LO[1], LO[2], LO[3], 0, PART_ORB);
    });
    const oc0 = hxf(P(ORB_C[0], ORB_C[1], 0));
    let oc = [kc[0] + (oc0[0] - kc[0]) * s, kc[1] + (oc0[1] - kc[1]) * s, kc[2] + (oc0[2] - kc[2]) * s];
    const xo = mp('orb');
    if (xo >= 0) {   // 용수철처럼 통통
      const ax = norm3([oc0[0] - kc[0], oc0[1] - kc[1], 0]), d = 55 * Math.exp(-3 * xo) * Math.sin(2 * Math.PI * 3.5 * xo), sd = 28 * Math.exp(-3 * xo) * Math.sin(2 * Math.PI * 2.5 * xo + 1);

    }

    }
    const rr = ORB_R * s * sx;
    const pulse = 1 + (STILL ? 0 : 0.15 * Math.sin(ta * 3) * idle), mo = clamp01((t - (T_ORB + 0.5)) / 0.3), fl = Math.min(flash(t, T_ORB) * 0.5 + 0.3 * OC.tw, 0.6);
    const [O_RIM, O_BASE, O_GLOW, O_EDGE] = OC;          // 주황 → 빨강 → 금색 → 초록
    ellipsoid(oc, [rr, rr, rr], null, null, (k, tt) => {
      const nz = Math.max(VN[2], 0), vx = VN[0], vy = VN[1], w = Math.pow(nz, 0.6);
      let r = O_RIM[0] + (O_BASE[0] - O_RIM[0]) * w, g = O_RIM[1] + (O_BASE[1] - O_RIM[1]) * w, b = O_RIM[2] + (O_BASE[2] - O_RIM[2]) * w;
      const gl = clamp01(0.75 * Math.exp(-(((vx - 0.4) / 0.45) ** 2 + ((vy + 0.45) / 0.4) ** 2)) * pulse);
      r += (O_GLOW[0] - r) * gl; g += (O_GLOW[1] - g) * gl; b += (O_GLOW[2] - b) * gl;
      let mk = 0;
      if (mo > 0) {
        const mx = vx * ORB_R + ORB_C[0], my = ORB_C[1] - vy * ORB_R;
        const moon = (mx - MOON_OUT[0]) ** 2 + (my - MOON_OUT[1]) ** 2 < MOON_OUT[2] ** 2 && (mx - MOON_CUT[0]) ** 2 + (my - MOON_CUT[1]) ** 2 > MOON_CUT[2] ** 2;
        if (moon) { r += (MOON[0] - r) * mo; g += (MOON[1] - g) * mo; b += (MOON[2] - b) * mo; if (mo > 0.5) mk = MARK_MOON; }
      }
      const r_ = Math.hypot(vx, vy), an = Math.atan2(vy, vx);

      const dot = Math.exp(-(((vx + 0.3) / 0.1) ** 2 + ((vy - 0.62) / 0.07) ** 2));
      const gg = Math.min(0.75 * streak + 0.6 * dot, 0.9);

  // ── 산타 모자: 하늘에서 뿅 떨어져 머리에 쏙 ──
  STATE.pomView = null;

    const dp_ = clamp01((t - T_HAT) / (T_HAT_LAND - T_HAT)), fall = STILL ? 0 : 1 - dp_ * dp_;

    const ang = HAT_TILT + 0.6 * fall, ca = Math.cos(ang), sa = Math.sin(ang);

      HAT_CONE_R * hs, red, HAT_CUT);

    ellipsoid(H2C(0, 0), [HAT_BRIM[0] * sqx * sx, HAT_BRIM[1] * sqy * sy, HAT_BRIM[2] * sx], Rz, null, fur);
    const pc = H2C(HAT_POM[0] + wx, HAT_POM[1] + wy), pr = HAT_POM_R * sx * (1 + 0.05 * Math.abs(w));
    ellipsoid(pc, [pr, pr, pr], null, null, fur);
    STATE.pomView = toView(pc);
  }
}

// ═════════════════════════════════════════════════════════════════════

// ═════════════════════════════════════════════════════════════════════

//  선물 상자 · 고봉밥 (세상에 고정 — 캐릭터가 점프·흔들려도 그대로)
// ═════════════════════════════════════════════════════════════════════
function drawGift(t, ta) {
  if (!GS.on) return;
  setRays(0, 1, 1, 0);
  const groundY = CY - 1652;
  const bc = P(871, 1652 - BOX_H[1] + 200 * (1 - GS.box), BOX_Z);
  const band = 20;
  const shadeBox = (fa, lx, ly, lz, isTop) => {     // 빨간 상자 + 금색 리본
    const rib = fa === 0 ? Math.abs(lz) < band : fa === 2 ? Math.abs(lx) < band : (Math.abs(lx) < band || Math.abs(lz) < band);
    if (rib) lit(VN[0], VN[1], VN[2], GOLD, GOLD_SH, GOLD_DEEP, 0, 0.3, GOLD_HI);
    else lit(VN[0], VN[1], VN[2], RED, RED_SH, RED_DEEP, isTop ? 0 : 0.05, 0.08, RED_HI);
  };
  // 상자 몸통 (땅 아래는 안 보임)
  hitOBB(bc, BOX_H, I3, (k, tt, lx, ly, lz, fa) => {
    if (bc[1] + ly < groundY) return;
    shadeBox(fa, lx, ly, lz, false);
    put(k, tt, LO[0], LO[1], LO[2], LO[3], 0, PART_GIFT);
  });
  // 뚜껑 + 리본 매듭: 착지하면 뻥 튀어 올라 빙글빙글 날아가요
  const ls = GS.lidS;
  if (ls < 1.8) {
    let lc = [bc[0], bc[1] + BOX_H[1] + LID_H[1] - 6, bc[2]], Rl = I3;
    if (ls > 0) {
      lc = [lc[0] - 320 * ls, lc[1] + 1150 * ls - 380 * ls * ls, lc[2] + 80 * ls];
      Rl = mm3(rotZ(5.5 * ls), rotAxis([1, 0, 0.3], 3.2 * ls));
    }
    hitOBB(lc, LID_H, Rl, (k, tt, lx, ly, lz, fa) => {
      if (lc[1] + ly < groundY) return;
      shadeBox(fa, lx, ly, lz, fa === 1);
      put(k, tt, LO[0], LO[1], LO[2], LO[3], 0, PART_GIFT);
    });
    const ribbon = (k, tt) => { lit(VN[0], VN[1], VN[2], GOLD, GOLD_SH, GOLD_DEEP, 0, 0.35, GOLD_HI); put(k, tt, LO[0], LO[1], LO[2], LO[3], 0, PART_GIFT); };
    for (const sg of [-1, 1]) {
      const off = mv(Rl, [sg * 44, LID_H[1] + 26, 0]);
      ellipsoid([lc[0] + off[0], lc[1] + off[1], lc[2] + off[2]], [50, 28, 22], mm3(Rl, rotZ(sg * 0.45)), null, ribbon);
    }
    const ko = mv(Rl, [0, LID_H[1] + 18, 0]);
    ellipsoid([lc[0] + ko[0], lc[1] + ko[1], lc[2] + ko[2]], [24, 22, 22], Rl, null, ribbon);
  }
  // 금빛 놋그릇 + 고봉밥 (상자 안에서 천천히 쑥)
  STATE.riceTop = 0;
  const bs = GS.bowlS;
  if (GS.rise <= 0 || bs <= 0.01) return;
  const rimY = BOWL_PY + (1 - GS.rise) * 260;
  const bw = P(871, rimY, BOX_Z), tw = GS.bowlTw;
  ellipsoid(bw, [BOWL_R[0] * bs, BOWL_R[1] * bs, BOWL_R[2] * bs], null, null, (k, tt, qx, qy) => {
    if (qy > 0) return;                                   // 아래 반쪽 = 그릇
    if (qy > -0.15) {                                    // 테두리 하이라이트
      lit(VN[0], VN[1], VN[2], BRASS_HI, BRASS, BRASS_SH, 0, 0.5, null); flashLO(tw * 0.6);
      put(k, tt, LO[0], LO[1], LO[2], LO[3], MARK_RIM, PART_GIFT); return;
    }
    lit(VN[0], VN[1], VN[2], BRASS, BRASS_SH, BRASS_DEEP, 0, 0.45, BRASS_HI); flashLO(tw * 0.5);
    put(k, tt, LO[0], LO[1], LO[2], LO[3], 0, PART_GIFT);
  });

    ellipsoid(rc, [RICE_R[0] * bs, RICE_R[1] * hgt * bs, RICE_R[2] * bs], null, null, (k, tt, qx, qy, qz) => {
      if (qy < -0.05) return;
      const n = 0.5 + 0.5 * Math.sin(qx * 31 + qy * 17) * Math.sin(qz * 27 - qy * 23);   // 밥알 오돌토돌
      lit(VN[0], VN[1], VN[2], RICE, RICE_SH, RICE_DEEP, 0.18 * n, 0.12, null); flashLO(tw * 0.4);
      put(k, tt, LO[0], LO[1], LO[2], LO[3], MARK_RICE, PART_GIFT);
    });
    STATE.riceTop = rimY + 6 * bs - RICE_R[1] * hgt * bs;
  } else STATE.riceTop = rimY;
}

function addGlow(px, py, C, I, kind = 0) {       // 사진 좌표에 빛 더하기(겹칠수록 밝게)
  const c = Math.round((px - PX0) / (dp * S) - 0.5), r = Math.round((py - PY0) / (dp * 2 * S) - 0.5);
  addGlowCell(r, c, C, I, kind);
}
function addGlowCell(r, c, C, I, kind = 0) {
  if (r < 0 || r >= TR || c < 0 || c >= TC || !(I > 0)) return;
  const q = r * TC + c;
  gI[q] += I; gR[q] += C[0] * I; gG[q] += C[1] * I; gBl[q] += C[2] * I;
  if (kind === 1) gHeart[q] += I; else if (kind === 2) gStar[q] += I;
}
function coverAt(px, py) {
  const c = Math.round((px - PX0) / (dp * S) - 0.5), r = Math.round((py - PY0) / (dp * 2 * S) - 0.5);
  if (r < 0 || r >= TR || c < 0 || c >= TC) return 0;
  return cellHit[r * TC + c] / (2 * S * S);
}

function compose(t, ta, yaw, jumpLift) {

          const ra = BG_RA[k]; if (ra <= 0) continue;

    const fade = clamp01((T_V_END + 0.4 - t) / 0.4);

function paint() {

    const y = y0D + r * chD;

  const k = Math.floor(u / per), f = smooth(per - 1.4, per, u - k * per);
  const A = ORB_PAL[k % n], B = ORB_PAL[(k + 1) % n];
  for (let i = 0; i < 4; i++) for (let c = 0; c < 3; c++) OC[i][c] = A[i][c] + (B[i][c] - A[i][c]) * f;
  const d = u - Math.round(u / per) * per;
  OC.tw = u > 1 ? Math.exp(-((d / 0.35) ** 2)) : 0;
  return u > 1 ? Math.round(u / per) : -1;
}
function frame(dt) {
  if (!FREEZE) clock += dt;
  const t = REF ? T_IDLE + 4 : clock, ta = clock;
  autoMotion();
  computeFX();
  const ok = orbColors(ta);
  if (ok !== lastOrbK) { if (ok > 0 && STATE.orbView && !FREEZE) emitSparkles(STATE.orbView[0], STATE.orbView[1], 6, 380, null, 0.6, 0); lastOrbK = ok; }
  if (!hatLandFx && t >= T_HAT_LAND && !FREEZE) {            // 모자 쏙: 반짝
    hatLandFx = true;
    if (t < T_HAT_LAND + 0.5) { emitSparkles(HAT_C[0], HAT_C[1] - 20, 12, 520, null, 0.6, 200, Math.PI * 1.2, -Math.PI / 2); kickHat(1); }
  }
  updateFlurry(FREEZE ? 0 : dt);
  // 좌우 흔들림 (손 흔들기·선물·눈 받아먹기·에취 땐 정면으로)
  const wavePrep = motions.wave !== undefined || FORCE === 'wave' || FX.calm;
  swayAmp += ((wavePrep ? 0 : 1) - swayAmp) * Math.min(1, (FORCE ? 1 : dt * 9));
  let yaw = STILL ? 0 : (SWAY_DEG * Math.PI / 180) * Math.sin(2 * Math.PI * ta / SWAY_PERIOD) * swayAmp;
  yaw += FX.yaw;
  const xs = mp('spin');
  if (xs >= 0) {
    yaw += 2 * Math.PI * easeInOutCubic(xs);
    if (!FORCE && motions.spin !== undefined && !motions.spinHearts && xs > 0.45) { emitHearts(7, true); motions.spinHearts = 1; }
  } else if (motions.spinHearts) delete motions.spinHearts;
  // 점프: 웅크림 → 폴짝 → 착지 찌그러짐 → 통통
  let gsx = 1, gsy = 1, jy = 0;
  const xj = mp('jump');
  if (xj >= 0) {
    jumpPose(xj); gsx = JP.gsx; gsy = JP.gsy; jy = JP.jy;
    if (JP.land && !landed && !FORCE) { landed = true; emitLanding(); }
  }
  gsx *= FX.gsx; gsy *= FX.gsy; jy += FX.jy;
  for (let i = particles.length - 1; i >= 0; i--) {
    const pa = particles[i]; pa.age += FREEZE ? 0 : dt;
    if (pa.age > 0) { pa.x += pa.vx * dt; pa.y += pa.vy * dt; pa.vy += pa.g * dt; if (pa.heart) pa.vx *= 0.97; }
    if (pa.age > pa.life) particles.splice(i, 1);
  }
  setupRays(yaw, gsx, gsy, jy);
  drawCharacter(t, ta);
  drawGift(t, ta);
  compose(t, ta, yaw, jy);
  paint();
  if (built()) bar.classList.remove('off');
}

// ═════════════════════════════════════════════════════════════════════
//  실행: 1초에 30번, 다른 탭이면 멈춤
// ═════════════════════════════════════════════════════════════════════
const bar = document.getElementById('bar');
let last = 0, raf = 0, slowFrames = 0;
function loop(now) {
  raf = requestAnimationFrame(loop);
  if (now - last < 1000 / 30 - 2) return;
  const dt = last ? Math.min((now - last) / 1000, 0.1) : 1 / 30;
  last = now;
  const t0 = performance.now();
  frame(dt);
  // 너무 느린 기기면 점 개수를 줄여요
  if (performance.now() - t0 > 30 && S > 1 && !REF) { if (++slowFrames > 20) { S = 1; layout(); slowFrames = 0; } }
  else slowFrames = Math.max(0, slowFrames - 1);
}
function start() { if (!raf) { last = 0; raf = requestAnimationFrame(loop); } }
function stop() { cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
let resizeTimer = 0;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 120); });
if (QS.has('t')) { clock = parseFloat(QS.get('t')) || 0; }
if (QS.has('vw')) {        // 미리보기: 주어진 폰 화면 크기 상자 안에 그리기  (?vw=390&vh=844)
  Object.assign(document.body.style, { right: 'auto', bottom: 'auto', width: QS.get('vw') + 'px', height: (QS.get('vh') || 844) + 'px', outline: '1px solid #333' });
}
layout();
start();

// ═════════════════════════════════════════════════════════════════════
//  터치·버튼·키보드
// ═════════════════════════════════════════════════════════════════════
function partAt(clientX, clientY) {
  const rect = cv.getBoundingClientRect();
  const xD = (clientX - rect.left) * dpr - x0D, yD = (clientY - rect.top) * dpr - y0D;
  const i0 = Math.floor(xD / cwD * S), j0 = Math.floor(yD / chD * 2 * S), rad = 2 * S;
  const votes = [0, 0, 0, 0, 0, 0, 0];
  for (let j = j0 - rad; j <= j0 + rad; j++) for (let i = i0 - rad; i <= i0 + rad; i++) {
    if (i < 0 || j < 0 || i >= NX || j >= NY) continue;
    votes[PB[j * NX + i]] += 1 / (1 + Math.abs(i - i0) + Math.abs(j - j0));
  }
  let best = 0; for (let k = 1; k < votes.length; k++) if (votes[k] > votes[best] || (best === 0 && votes[k] > 0)) best = k;
  return best;
}
let ptr = null;
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), long: false, moved: false, dir: 0, ext: e.clientX, rev: 0, revT: 0, globe: false };
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  ptr.timer = setTimeout(() => { if (ptr && !ptr.moved) { ptr.long = true; trigger('hearts'); } }, 450);
});
cv.addEventListener('pointermove', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  if (Math.hypot(e.clientX - ptr.x, e.clientY - ptr.y) > 14) ptr.moved = true;
  // 좌우 방향이 몇 번 바뀌었는지 세기: 한 번 쓸기(0번) = 빙글, 빠르게 여러 번 문지르기(3번↑) = 스노우볼
  const x = e.clientX, now = performance.now();
  let flip = false;
  if (ptr.dir === 0) { if (Math.abs(x - ptr.x) > 18) { ptr.dir = Math.sign(x - ptr.x); ptr.ext = x; } }
  else if (ptr.dir > 0) { if (x > ptr.ext) ptr.ext = x; else if (ptr.ext - x > 22) { ptr.dir = -1; ptr.ext = x; flip = true; } }
  else { if (x < ptr.ext) ptr.ext = x; else if (x - ptr.ext > 22) { ptr.dir = 1; ptr.ext = x; flip = true; } }
  if (flip) {
    ptr.rev = now - ptr.revT < 450 || ptr.rev === 0 ? ptr.rev + 1 : 1;    // 천천히 왔다갔다는 문지르기로 안 쳐요
    ptr.revT = now;
    if (ptr.rev >= 3) { ptr.globe = true; trigger('globe'); }
  }
});
function endPtr(e, cancel) {
  if (!ptr || e.pointerId !== ptr.id) return;
  clearTimeout(ptr.timer);
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
  if (!cancel && !ptr.long) {
    if (ptr.globe || ptr.rev >= 2) { /* 문지르기 — 빙글 안 함 */ }
    else if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) trigger('spin');
    else if (!ptr.moved) {
      const part = partAt(e.clientX, e.clientY);
      if (part === PART_BODY) trigger('jump'); else if (part === PART_FACE) trigger('wink');
      else if (part === PART_ORB) trigger('orb'); else if (part === PART_WING) trigger('flap');
      else if (part === PART_HAT) trigger('hat');
    }
  }
  ptr = null;
}
cv.addEventListener('pointerup', e => endPtr(e, false));
cv.addEventListener('pointercancel', e => endPtr(e, true));
for (const b of document.querySelectorAll('.btn')) {
  b.addEventListener('pointerdown', e => { e.preventDefault(); trigger(b.dataset.m); b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 120); });
}
const KEYS = { j: 'jump', w: 'wave', f: 'flap', e: 'wink', s: 'spin', h: 'hearts', g: 'gift', n: 'catch', c: 'sneeze' };
window.addEventListener('keydown', e => { const m = KEYS[e.key.toLowerCase()]; if (m && !e.repeat) trigger(m); });
// 확대·스크롤·당겨서 새로고침 막기
for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
